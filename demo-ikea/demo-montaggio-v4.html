html,body{width:1280px;height:720px;overflow:hidden;background:#0058a3;font-family:"NS",sans-serif;color:var(--ink)}

#k{font:700 13px "NS";letter-spacing:.14em;color:var(--blue);text-transform:uppercase}
#h{font:800 38px "NS";margin:5px 0 5px;letter-spacing:-.015em;color:var(--ink)}
#p{font:400 18px "NS";color:var(--mut);line-height:1.38}

#lines{position:absolute;inset:0;pointer-events:none}
